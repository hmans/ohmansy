[tools]
rust = { version = "1.90.0", profile = "minimal", components = "rustfmt,clippy" }

[tasks.spatial]
description = "Run the spatial window experiment inside the current desktop"
run = "bash tools/dev/spatial.sh run"

[tasks.spatial-check]
description = "Check the Rust spatial window experiment"
run = "bash tools/dev/spatial.sh check"

[tasks.compositor]
description = "Run Shine with live applications"
run = "OHMANSY_EXPERIMENT=compositor bash tools/dev/spatial.sh run"

[tasks.compositor-check]
description = "Check Shine"
run = "OHMANSY_EXPERIMENT=compositor bash tools/dev/spatial.sh check"

[tasks.compositor-desktop]
description = "Try Shine with a browser, editor, and terminal"
run = "OHMANSY_REQUIRE_HARDWARE_RENDERER=1 OHMANSY_EXPERIMENT=compositor bash tools/dev/spatial.sh run --desktop"

[tasks.shine-dev]
description = "Watch and rebuild the GPU-only nested Shine desktop"
run = "OHMANSY_EXPERIMENT=compositor bash tools/dev/spatial.sh dev"

[tasks.shine-check]
description = "Verify Shine packaging and private GPU trials; --no-graphics skips GPU work"
run = "bash tools/dev/shine-check.sh"

[tasks.compositor-integration]
description = "Test disposable browser/editor clients in Shine"
run = "OHMANSY_EXPERIMENT=compositor bash tools/dev/spatial.sh integration"

[tasks.compositor-test]
description = "Run a compositor test on a private headless display"
run = "python3 tools/dev/compositor-test-display.py --"

[tasks.compositor-session]
description = "Preview the packaged Shine session"
run = "nix run --no-update-lock-file .#compositor-session -- --nested"

[tasks.clean]
description = "Remove unused build artifacts; preserve VM state unless explicitly selected"
run = "python3 tools/dev/clean.py"

[tasks.os-build]
description = "Build this machine's OS with the ohmansy checkout"
run = "bash tools/dev/os-rebuild.sh build"

[tasks.os-test]
description = "Activate checkout changes without changing the boot default"
run = "bash tools/dev/os-rebuild.sh test"

[tasks.os-switch]
description = "Activate checkout changes and select them for future boots"
run = "bash tools/dev/os-rebuild.sh switch"

[tasks.os-boot]
description = "Build checkout changes for the next boot without activating them now"
run = "bash tools/dev/os-rebuild.sh boot"

[tasks.display-ui]
description = "Preview display controls with simulated monitors"
run = "nix run --no-update-lock-file .#display-preview"

[tasks.installer-iso]
description = "Build the installer ISO when its sources change"
sources = ["flake.nix", "flake.lock", "nix/**/*", "tools/build/installer-iso.sh"]
outputs = ["dist/installer/ohmansy-installer.iso"]
run = "bash tools/build/installer-iso.sh"

[tasks.installer-vm]
description = "Boot the installer ISO in QEMU, preserving the test disk"
depends = ["installer-iso"]
run = "bash tools/dev/installer-vm.sh iso"

[tasks.installer-ui]
description = "Preview the installer with mock disks and live QML edits"
run = "bash tools/dev/installer-ui.sh"

[tasks.installed-vm]
description = "Boot the installed QEMU disk without installation media"
run = "bash tools/dev/installer-vm.sh disk"
