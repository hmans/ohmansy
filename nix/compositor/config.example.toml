# Adapt connector names and logical positions to your monitors.
[[outputs]]
name = "DP-2"
position = [0, 0]
scale = 1.25

[[outputs]]
name = "DP-1"
position = [2048, 0]
scale = 1.25
primary = true

[input.keyboard]
layout = "us"

# Mod+Shift+Return focuses a matching window, or launches this command.
# Arguments are passed directly, without a shell. app_ids = [] always launches.
[browser]
program = "firefox"
args = []
app_ids = ["firefox", "org.mozilla.firefox"]

# Target shortcuts delivered to the focused app. Terminal IDs match exactly;
# supplying a list replaces the defaults. An empty list treats all apps alike.
[clipboard]
copy = "Ctrl+C"
paste = "Ctrl+V"
terminal_copy = "Ctrl+Shift+C"
terminal_paste = "Ctrl+Shift+V"
terminal_app_ids = ["foot", "footclient", "org.codeberg.dnkl.foot", "Alacritty", "kitty", "com.mitchellh.ghostty", "org.wezfurlong.wezterm", "wezterm", "org.gnome.Terminal", "org.gnome.Console", "ohmansy-nested-client"]

[input.touchpad]
tap = true
natural_scroll = true

[layout]
gap = 12
default_column_width = { proportion = 0.62 }

[decorations]
corner_radius = 14

[decorations.frame]
enabled = true
width = 7 # Sides and bottom, logical pixels (1–16)
titlebar_height = 30 # Top edge for icon and title (20–64)
title_font_size = 13.0 # Logical pixels (4–64)
icon_width = 18 # Logical pixels (1–128)
icon_height = 18 # Logical pixels (1–128)
title_padding = 11 # Left/right caption padding (0–128)
icon_title_gap = 7 # Space between icon and text (0–128)
outer_corner_radius = 10 # Frame silhouette, including its shadow (0–128)
inner_corner_radius = 8 # Client content cutout (0–128)
focus_duration_ms = 150 # Focus tint fade; 0 disables it (0–5000)
focus_easing = "ease-in-out" # linear, ease-in, ease-out, ease-in-out
active_color = [0.317647, 0.250980, 0.372549, 0.55]
inactive_color = [0.145098, 0.156863, 0.207843, 0.40]

[decorations.frame.glass]
enabled = true
blur_radius = 12
opacity = 0.9
noise = 0.025

[decorations.frame.bevel]
enabled = true
width = 1.5 # Outer bevel, logical pixels (0–16)
inner_width = 1.0 # Reversed bevel around the client cutout (0–16)
highlight = 0.20 # Highlight strength (0–1)
shadow = 0.18 # Shading strength (0–1)
light_direction = [-1.0, -1.0] # Toward the light: northwest in screen coordinates

[decorations.frame.inset_shadow]
enabled = false
width = 8.0 # Shadow cast inward over app content (0–64 logical pixels)
softness = 8.0 # Soft falloff, logical pixels (0–64)
offset = [2.0, 2.0] # Positive values cast farther down/right (−64–64)
color = [0.0, 0.0, 0.0, 0.22] # RGBA overlay; the app's own buffer stays unchanged

[decorations.shadow]
enabled = true
softness = 12 # Falloff scale in logical pixels (1–64)
spread = 2 # Expand the shadow before softening (0–64)
offset = [0, 6] # Horizontal and vertical logical pixels (−128–128)
color = [0.0, 0.0, 0.0, 0.35] # RGBA, each from 0 to 1

[decorations.inactive]
# Numeric values outside the ranges below are clamped when loaded.
enabled = true
scale = 0.99 # Visual scale only; app sizes and layout stay unchanged (0.8–1)
saturation = 0.85 # 0 is grayscale, 1 preserves colors
fog = 0.08 # Mix toward fog_color without changing opacity (0–1)
fog_color = [0.5, 0.5, 0.55] # RGB, each from 0 to 1
duration_ms = 160 # Cubic ease-out focus transition; respects animations.enabled
easing = "ease-out" # linear, ease-in, ease-out, or ease-in-out

# Mod is Super in a login and Super+Alt in a nested preview.
# Omitted bindings keep their defaults. Use action="none" to remove one.
[bindings]
"Mod+C" = { action = "copy" }
"Mod+V" = { action = "paste" }
"Mod+E" = { action = "launch", program = "nautilus" }
"Mod+Return" = { action = "terminal" }
"Mod+Shift+Return" = { action = "browser" }
"Mod+Space" = { action = "launcher" }
"Mod+R" = { action = "cycle-width" }
"Mod+Shift+R" = { action = "cycle-width", reverse = true }
"Mod+Left" = { action = "focus-prev" }
"Mod+Right" = { action = "focus-next" }
"Mod+Tab" = { action = "focus-next-wrap" }
"Mod+Shift+Space" = { action = "toggle-floating" }
"Mod+Shift+Right" = { action = "move-next" }
"Mod+1" = { action = "workspace", value = 1 }
"Mod+Up" = { action = "workspace-prev" }
"Mod+Down" = { action = "workspace-next" }
"Mod+Shift+Up" = { action = "move-workspace-prev" }
"Mod+Shift+Down" = { action = "move-workspace-next" }
"Mod+W" = { action = "close" }
"Mod+F" = { action = "maximize" }
"Mod+Shift+F" = { action = "fullscreen" }
"Mod+minus" = { action = "scale-adjust", value = -5 }
"Mod+equal" = { action = "scale-adjust", value = 5 }
"Mod+0" = { action = "scale", value = 100 }

# Exact app_id matches. Last matching rule wins. Defaults affect new windows.
[[window_rules]]
match = { app_id = "firefox" }
default_column_width = { proportion = 0.75 }

[[window_rules]]
match = { app_id = "org.gnome.TextEditor" }
default_column_width = { pixels = 900 }

[animations]
enabled = true
duration_ms = 180
