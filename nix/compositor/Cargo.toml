[package]
name = "ohmansy-compositor"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
publish = false

[dependencies]
anyhow = "1.0"
image = { version = "0.25.8", default-features = false, features = ["png"] }
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
toml_edit = "0.22"
bitflags = "2.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
smithay = { version = "=0.7.0", default-features = false, features = ["backend_winit", "wayland_frontend", "desktop", "backend_drm", "backend_gbm", "backend_libinput", "backend_udev", "backend_session_libseat"] }
xcursor = "0.3"
winit = { version = "0.30", default-features = false, features = ["wayland", "wayland-dlopen", "rwh_06"] }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
