[package]
name = "ohmansy-spatial"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
publish = false

[dependencies]
anyhow = "1.0"
eframe = { version = "0.32.3", default-features = false, features = ["default_fonts", "glow", "wayland"] }
glam = "0.30"
image = { version = "0.25.8", default-features = false, features = ["png"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.20"
wl-clipboard-rs = "0.9"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
